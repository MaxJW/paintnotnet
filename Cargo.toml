[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
pnn-core = { path = "crates/pnn-core" }
pnn-sdf = { path = "crates/pnn-sdf" }
pnn-effects = { path = "crates/pnn-effects" }
pnn-tools = { path = "crates/pnn-tools" }
pnn-io = { path = "crates/pnn-io" }
pnn-render = { path = "crates/pnn-render" }

# GUI: eframe drives winit + wgpu. Web-only features are left out.
eframe = { version = "=0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "x11",
    "wgpu",
] }
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
egui_kittest = "=0.36.2"
wgpu = "=30.0.1"
raw-window-handle = "0.6"

log = "0.4.34"
env_logger = "0.11.11"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Image work is unusably slow unoptimised; keep our crates debuggable but optimise deps.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
