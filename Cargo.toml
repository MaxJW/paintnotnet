[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
pnn-core = { path = "crates/pnn-core" }
pnn-sdf = { path = "crates/pnn-sdf" }
pnn-effects = { path = "crates/pnn-effects" }
pnn-tools = { path = "crates/pnn-tools" }
pnn-io = { path = "crates/pnn-io" }
pnn-render = { path = "crates/pnn-render" }

# GUI: eframe drives winit + wgpu. Web-only features are left out.
eframe = { version = "=0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "x11",
    "wgpu",
] }
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
egui_kittest = "=0.36.2"
wgpu = "=30.0.1"
raw-window-handle = "0.6"
# KDE global menu: dbusmenu on the session bus, linked to the window over Wayland.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
zvariant = "5.15"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
# Raising the window for a file opened from the desktop (xdg-activation).
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

rayon = "1.12.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = "0.25.10"
rfd = "0.17.2"
thiserror = "2.0.21"
tempfile = "3"
i_overlay = "9.0.1"
tiny-skia = "0.12.0"
# Lucide icons (SVG) rasterised at startup; no text, fonts or raster images needed.
resvg = { version = "0.48.1", default-features = false }
cosmic-text = "0.19.0"
webp = { version = "0.3.1", default-features = false }
libwebp-sys = "0.9.6"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

log = "0.4.34"
env_logger = "0.11.11"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Image work is unusably slow unoptimised; keep our crates debuggable but optimise deps.
[profile.dev]
opt-level = 1
# Line numbers in backtraces are enough; full debug info made every test binary huge and
# linking it the slowest part of a build.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
